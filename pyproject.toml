[project]
name = "memory-cards"
version = "0.1.0"
description = "Anki deck builder for the Goethe-Institut A1-B1 word lists (DE<->RU/UK)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pdfplumber>=0.11",
    "genanki>=0.13",
    "piper-tts>=1.2",
    "lameenc>=1.7",
]

[project.scripts]
mc = "memory_cards.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_cards"]
